services:
  # 1. FastAPI Agentic RAG Backend
  - type: web
    name: synapse-backend
    env: docker
    dockerfilePath: Dockerfile.backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: synapse-postgres
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_CHAT_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: OPENROUTER_FALLBACK_CHAT_MODELS
        value: qwen/qwen3.8-27b:free,google/gemma-4-31b-it:free,openrouter/free
      - key: OPENROUTER_EMBEDDING_MODEL
        value: nvidia/nemotron-3-embed-1b:free
      - key: DEFAULT_LLM_PROVIDER
        value: openrouter

  # 2. Next.js 15 Standalone Frontend
  - type: web
    name: synapse-frontend
    env: docker
    dockerfilePath: Dockerfile.frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: synapse-backend
          property: host

databases:
  - name: synapse-postgres
    databaseName: synapse_db
    user: synapse
    plan: free
